  - generic [ref=e361]: "Что изменилось. Сайдбар светлый, с иконками в плитках и оранжевой активной плиткой — он больше не спорит с содержимым и не выглядит чужим блоком. Прокручивается только содержимое, меню стоит на месте. Карусель на главной с точками и стрелками: три сюжета — портфолио, подготовка, стипендии. Рядом календарь на цветной карточке с сеткой дней, точками событий и белой панелью ближайших событий внутри. Правая половина больше не пустая. Везде две колонки: у портфолио слева данные, справа заполненность, профиль и вузы; у эссе слева редактор, справа помощник; у директора слева таблица, справа очередь подтверждений. Портфолио разобрано по иерархии: подпись мелкой капителью, значение обычным весом, длинные значения переносятся и занимают всю ширину. Крупными остаются только числа в плитках. «Мой путь» после прохождения сворачивается в одну строку и превращается в три карточки: что дальше, что усилит заявку, что нового. Карусель живёт, пока есть что закрывать. Переключатель «Состояние» вверху главной показывает оба случая: с незакрытыми местами — карусель, без них — карточка ближайшего события. Раздел «Мой путь» после пяти шагов уходит из меню совсем. Шесть кабинетов руководителей — шесть разных экранов. У Кымбат сверху числа по экзаменам и очередь баллов, сбоку кто просел по мокам. У Асем главное — дедлайны недели крупной карточкой, ниже баланс списков и справочник. У Салтанат первым идёт «Кому позвонить сегодня» с телефоном родителя в строке, ниже группы плитками с цветом риска. У Армана — материалы на проверке с кнопками одобрить-отклонить. У Нурлыбека — календарь стартов. У администратора — реестр и то, что требует его действий. Общее у всех: очередь подтверждений того, что внёс ученик, и таблицы только на чтение."