# Единая точка входа контура разработки: фронт на /, API и админка на бэк.
upstream backend_app {
    server backend:8000;
}

upstream frontend_app {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    location /api/  { proxy_pass http://backend_app; include /etc/nginx/proxy_params_lms.conf; }
    location /admin/ { proxy_pass http://backend_app; include /etc/nginx/proxy_params_lms.conf; }
    location /static/ { proxy_pass http://backend_app; include /etc/nginx/proxy_params_lms.conf; }
    location /media/ { proxy_pass http://backend_app; include /etc/nginx/proxy_params_lms.conf; }

    location / {
        proxy_pass http://frontend_app;
        include /etc/nginx/proxy_params_lms.conf;
        # Vite HMR ходит по websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
