# Боевой контур. Запуск: deploy/deploy.sh (собрать --no-cache → мигрировать → поднять)
# или руками: docker compose -f deploy/docker-compose.prod.yml up -d
#
# Отличия от контура разработки: gunicorn вместо runserver, Caddy с TLS
# от Let's Encrypt, отдельные контейнеры worker и beat, бэкапы с выгрузкой
# в хранилище, ротация логов. Postgres и Redis наружу не смотрят.
#
# Ничего специфичного для облака здесь нет: всё, что отличает одну машину
# от другой, — в deploy/.env.prod.

name: lms-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  build:
    context: ../backend
  image: lms-backend:prod
  env_file: [.env.prod]
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: postgres
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    # POSTGRES_DB / USER / PASSWORD образ читает прямо из env_file.
    # Подстановки вида ${POSTGRES_PASSWORD} здесь быть не должно: compose
    # берёт её из deploy/.env (файла разработки), а не из .env.prod, и база
    # инициализировалась одним паролем, а Django ходил с другим (фаза 56)
    env_file: [.env.prod]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  backend:
    <<: *backend
    entrypoint: ["/app/entrypoint.sh"]
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=4
      - --threads=2
      - --timeout=60
      - --graceful-timeout=30
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      # закрытые файлы материалов и документов: этот том Caddy намеренно
      # не монтирует, прямой ссылкой их скачать нельзя (фаза 19)
      - private_media:/app/private
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  celery-worker:
    <<: *backend
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4", "--max-tasks-per-child=200"]
    volumes:
      - media:/app/media
      - private_media:/app/private
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    <<: *backend
    entrypoint: []
    command:
      ["celery", "-A", "config", "beat", "-l", "info", "--pidfile=", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      # beat трогает файл расписания на каждом тике: свежая метка времени —
      # признак, что планировщик действительно работает, а не просто висит
      test:
        ["CMD-SHELL",
         "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/celerybeat-schedule') < 600 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend-build:
    build:
      context: ../frontend
    env_file: [.env.prod]
    command: ["sh", "-c", "npm run build && rm -rf /out/* && cp -r dist/* /out/"]
    volumes:
      - frontend_dist:/out
    restart: "no"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    env_file: [.env.prod]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      # сертификаты и состояние ACME: отдельный том переживает пересоздание
      # контейнера, а вместе с ним и лимит Let's Encrypt на перевыпуск
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      backend: {condition: service_healthy}
      frontend-build: {condition: service_completed_successfully}
    healthcheck:
      # управляющий порт Caddy отвечает, только когда конфиг загружен
      # и сервер работает; наружу этот порт не смотрит
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  backup:
    build:
      context: ./backup
    image: lms-backup:prod
    env_file: [.env.prod]
    # PG* скрипты собирают сами из POSTGRES_* того же env_file — см. выше,
    # почему здесь нет ${…}
    environment:
      PGHOST: postgres
    volumes:
      - ./backup:/scripts:ro
      - backups:/backups
      # файлы тоже часть бэкапа: база без них ссылается в пустоту
      - media:/app/media:ro
      - private_media:/app/private:ro
    entrypoint: ["/scripts/backup-loop.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  static:
  media:
  #: закрытые файлы материалов и документов — их не монтирует ни Caddy, ни что-либо ещё
  private_media:
  frontend_dist:
  backups:
  caddy_data:
  caddy_config:
