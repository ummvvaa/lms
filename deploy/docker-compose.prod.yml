# Боевой контур. Запуск: docker compose -f deploy/docker-compose.prod.yml up -d
# Отличия от контура разработки: gunicorn вместо runserver, nginx с TLS,
# отдельные контейнеры worker и beat, бэкапы, ротация логов.

name: lms-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  build:
    context: ../backend
  image: lms-backend:prod
  env_file: [.env.prod]
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: postgres
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    env_file: [.env.prod]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  backend:
    <<: *backend
    entrypoint: ["/app/entrypoint.sh"]
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=4
      - --threads=2
      - --timeout=60
      - --graceful-timeout=30
      - --max-requests=1000
      - --max-requests-jitter=100
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      # закрытые файлы материалов: этот том nginx намеренно не монтирует,
      # прямой ссылкой их скачать нельзя (фаза 19)
      - private_media:/app/private
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  celery-worker:
    <<: *backend
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4", "--max-tasks-per-child=200"]
    volumes:
      - media:/app/media
      - private_media:/app/private
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  celery-beat:
    <<: *backend
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "-l", "info", "--pidfile="]

  frontend-build:
    build:
      context: ../frontend
    env_file: [.env.prod]
    command: ["sh", "-c", "npm run build && rm -rf /out/* && cp -r dist/* /out/"]
    volumes:
      - frontend_dist:/out
    restart: "no"
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params_lms.conf:/etc/nginx/proxy_params_lms.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend: {condition: service_healthy}
      frontend-build: {condition: service_completed_successfully}
    restart: unless-stopped
    logging: *logging

  backup:
    image: postgres:16-alpine
    env_file: [.env.prod]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backup:/scripts:ro
      - backups:/backups
    entrypoint: ["/scripts/backup-loop.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  static:
  media:
  #: закрытые файлы материалов — их не монтирует ни nginx, ни что-либо ещё
  private_media:
  frontend_dist:
  backups:
  certbot_www:
