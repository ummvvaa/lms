# Боевой nginx: TLS, статика фронта с диска, API и админка на gunicorn.

# DNS Docker перечитываем: иначе после выката новой версии бэкенда
# nginx продолжит стучаться по старому IP и отдавать 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP: только редирект и ACME-проверка Let's Encrypt
server {
    listen 80;
    server_name ${SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Проверка живости самого nginx: без неё docker считает контейнер
    # здоровым, пока процесс не умер, — а он может стоять и отдавать 502
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    set $backend_app "backend:8000";

    # Пути задаются переменными: до выпуска сертификата это самоподписанный
    # из ./certs, после — живой из тома certbot. Подмена — одна переменная
    # в .env.prod, перевыпуск сертификата ничего в конфиге не трогает
    ssl_certificate     ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 32m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    #Проверки здоровья не должны попадать в редирект на фронт
    location = /healthz { proxy_pass http://$backend_app; include /etc/nginx/proxy_params_lms.conf; access_log off; }
    location = /readyz  { proxy_pass http://$backend_app; include /etc/nginx/proxy_params_lms.conf; access_log off; }

    location /api/   { proxy_pass http://$backend_app; include /etc/nginx/proxy_params_lms.conf; }
    location /admin/ { proxy_pass http://$backend_app; include /etc/nginx/proxy_params_lms.conf; }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # Фронт — SPA: неизвестные пути отдаём index.html, роутинг на клиенте
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
