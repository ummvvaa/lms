# Контур разработки. Запускается из корня репозитория: docker compose up
name: lms

services:
  postgres:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
      args:
        INSTALL_DEV: "true"
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      I18N_FRONTEND_DIR: /i18n-frontend
    volumes:
      - ../backend:/app
      # приёмочные тесты фазы 21 читают файлы контура и документацию:
      # без них проверить «боевые настройки строгие» изнутри контейнера
      # нечем. Только на чтение и только в контуре разработки
      - ..:/repo:ro
      # словари интерфейса на запись: `manage.py i18n_import` переносит
      # в них вычитанные переводы из таблицы. Только в контуре разработки
      - ../frontend/src/i18n:/i18n-frontend
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "8000:8000"

  celery:
    build:
      context: ../backend
      args:
        INSTALL_DEV: "true"
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      # бинд-маунт с Mac не всегда доносит события файлов: опрос, как у runserver
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend:/app
    # воркер перезапускается при правке .py — иначе задачи идут на старом коде
    command:
      - watchfiles
      - --filter
      - python
      - --ignore-paths
      - media,private,staticfiles
      - celery -A config worker -l info
      - /app
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ../frontend
    env_file: [.env]
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"

volumes:
  pgdata:
