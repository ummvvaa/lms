# Контур разработки. Запускается из корня репозитория: docker compose up
name: lms

services:
  postgres:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
      args:
        INSTALL_DEV: "true"
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ../backend:/app
    entrypoint: ["/app/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "8000:8000"

  celery:
    build:
      context: ../backend
      args:
        INSTALL_DEV: "true"
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ../backend:/app
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ../frontend
    env_file: [.env]
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params_lms.conf:/etc/nginx/proxy_params_lms.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"

volumes:
  pgdata:
