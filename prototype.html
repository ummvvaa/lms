<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платформа поступления — прототип</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:   { DEFAULT:'#FF6A13', dark:'#C2410C', soft:'#FFF1E6' },
        ink:     { DEFAULT:'#231F1C', 60:'#6B625B', 40:'#8A8078' },
        milk:    '#FBF8F4',
        line:    '#EDE6DE',
        teal:    '#0E7490',
        indigo:  '#4C5578',
        sand:    '#E8D5BC',
        ok:      '#0F766E',
        warn:    '#B45309',
        risk:    '#9F1239'
      },
      borderRadius: { xl2:'20px', xl3:'24px' }
    }
  }
}
</script>
<style>
  :root{
    --brand:#FF6A13; --brand-dark:#C2410C; --brand-soft:#FFF1E6;
    --ink:#231F1C; --ink-60:#6B625B; --ink-40:#8A8078;
    --milk:#FBF8F4; --line:#EDE6DE;
    --teal:#0E7490; --indigo:#4C5578; --sand:#E8D5BC;
    --ok:#0F766E; --warn:#B45309; --risk:#9F1239;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--milk); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
  h1,h2,h3{letter-spacing:-.025em;margin:0}

  /* ---- surfaces ---- */
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(35,31,28,.04),0 8px 24px -16px rgba(35,31,28,.10)}
  .card-pad{padding:20px}
  .hairline{border-color:var(--line)}

  /* ---- eyebrow ---- */
  .eyebrow{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:5px 13px 5px 10px;font-size:12.5px;font-weight:650;color:var(--ink-60)}

  /* ---- buttons ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;
    font-weight:650;font-size:14px;padding:10px 18px;border:1px solid transparent;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .08s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink-40)}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:11px}
  .btn:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{
    outline:2px solid var(--brand);outline-offset:2px}

  /* ---- chips ---- */
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;
    font-size:12px;font-weight:650;border:1px solid transparent;white-space:nowrap}
  .chip-ok{background:rgba(15,118,110,.10);color:var(--ok)}
  .chip-warn{background:rgba(180,83,9,.10);color:var(--warn)}
  .chip-risk{background:rgba(159,18,57,.10);color:var(--risk)}
  .chip-brand{background:var(--brand-soft);color:var(--brand-dark)}
  .chip-mute{background:#F4F0EB;color:var(--ink-60)}
  .chip-teal{background:rgba(14,116,144,.10);color:var(--teal)}
  .chip-indigo{background:rgba(76,85,120,.12);color:var(--indigo)}

  /* ---- nav ---- */
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:13px;
    font-size:14.5px;font-weight:600;color:var(--ink-60);cursor:pointer;transition:.15s;width:100%;text-align:left;
    background:transparent;border:none;font-family:inherit}
  .navlink:hover{background:#fff;color:var(--ink)}
  .navlink.active{background:var(--ink);color:#fff}
  .navlink .ic{width:20px;text-align:center;font-size:15px}

  /* ---- table ---- */
  .grid-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  .grid-tbl th{position:sticky;top:0;z-index:2;background:#F4F0EB;color:var(--ink-60);
    font-weight:650;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
  .grid-tbl td{padding:0;border-bottom:1px solid var(--line);background:#fff}
  .grid-tbl tr:hover td{background:#FDFBF8}
  .cell{padding:7px 10px;min-height:34px;display:block;width:100%;border:2px solid transparent;
    border-radius:8px;font:inherit;background:transparent;color:inherit}
  .cell:focus{border-color:var(--brand);background:var(--brand-soft);outline:none}
  .cell-ro{color:var(--ink-40)}
  .sticky-col{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line)}
  .grid-tbl tr:hover .sticky-col{background:#FDFBF8}

  /* ---- misc ---- */
  .bar{height:7px;border-radius:99px;background:#F0EBE5;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px}
  .avatar{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:#fff;
    border-left:1px solid var(--line);box-shadow:-20px 0 60px -30px rgba(35,31,28,.35);
    transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:60;overflow-y:auto}
  .drawer.open{transform:none}
  .drawer-left{left:0;right:auto;border-left:none;border-right:1px solid var(--line);transform:translateX(-101%)}
  .drawer-left.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(35,31,28,.28);opacity:0;pointer-events:none;transition:opacity .28s;z-index:50}
  .scrim.open{opacity:1;pointer-events:auto}
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ringtrack{stroke:#F0EBE5}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#DED5CC;border-radius:99px;border:3px solid var(--milk)}
</style>
</head>
<body>

<!-- ============ ВХОД ============ -->
<div id="login" class="min-h-screen grid place-items-center px-5">
  <div class="w-full max-w-[420px] text-center fade">
    <div class="mx-auto mb-7 w-14 h-14 rounded-2xl grid place-items-center text-white text-2xl font-black"
         style="background:var(--brand)">A</div>
    <h1 class="text-[30px] font-extrabold leading-tight">Кабинет поступления</h1>
    <p class="mt-2.5 text-[15px]" style="color:var(--ink-60)">
      Вход только для учеников и сотрудников школы
    </p>
    <div class="card card-pad mt-7 text-left">
      <button onclick="signIn()" class="w-full flex items-center justify-center gap-3 py-3.5 rounded-2xl font-semibold"
              style="border:1px solid var(--line);background:#fff">
        <svg width="19" height="19" viewBox="0 0 23 23" aria-hidden="true">
          <rect width="10" height="10" x="1" y="1" fill="#F25022"/><rect width="10" height="10" x="12" y="1" fill="#7FBA00"/>
          <rect width="10" height="10" x="1" y="12" fill="#00A4EF"/><rect width="10" height="10" x="12" y="12" fill="#FFB900"/>
        </svg>
        Войти через школьный аккаунт
      </button>
      <p class="mt-3.5 text-[12.5px] leading-relaxed" style="color:var(--ink-40)">
        Пароль вводится на стороне Microsoft. Школа его не хранит.
      </p>
    </div>
    <p class="mt-6 text-[12px]" style="color:var(--ink-40)">Демо-прототип. Все данные вымышленные.</p>
  </div>
</div>

<!-- ============ ПРИЛОЖЕНИЕ ============ -->
<div id="app" class="hidden min-h-screen">
  <div class="flex min-h-screen">

    <!-- боковая навигация -->
    <aside class="hidden lg:flex flex-col w-[248px] flex-none p-4 gap-1 border-r"
           style="border-color:var(--line);background:#F7F3EE">
      <div class="flex items-center gap-2.5 px-2 py-3 mb-2">
        <div class="w-8 h-8 rounded-xl grid place-items-center text-white font-black text-sm" style="background:var(--brand)">A</div>
        <div class="font-extrabold text-[15px]">Alma&nbsp;Path</div>
      </div>
      <nav id="nav" class="flex flex-col gap-1"></nav>
      <div class="mt-auto p-3 rounded-2xl" style="background:#fff;border:1px solid var(--line)">
        <div id="whoami" class="text-[13px] font-bold"></div>
        <div id="whorole" class="text-[12px] mt-0.5" style="color:var(--ink-40)"></div>
      </div>
    </aside>

    <!-- контент -->
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="sticky top-0 z-30 flex items-center gap-3 px-5 lg:px-8 py-3.5 border-b"
              style="border-color:var(--line);background:rgba(251,248,244,.86);backdrop-filter:blur(10px)">
        <button onclick="toggleMobileNav()" class="lg:hidden btn btn-ghost btn-sm">☰</button>
        <div id="crumb" class="font-bold text-[15px] truncate"></div>
        <div class="ml-auto flex items-center gap-2.5">
          <span class="chip chip-mute hidden sm:inline-flex">Демо-режим</span>
          <select id="roleSel" onchange="setRole(this.value)"
                  class="text-[13px] font-semibold rounded-xl px-3 py-2 cursor-pointer"
                  style="border:1px solid var(--line);background:#fff"></select>
        </div>
      </header>
      <main id="screen" class="flex-1 px-5 lg:px-8 py-6 lg:py-8"></main>
    </div>
  </div>
</div>

<!-- мобильная навигация -->
<div id="mscrim" class="scrim lg:hidden" onclick="toggleMobileNav()"></div>
<aside id="mnav" class="drawer drawer-left lg:hidden" style="width:min(280px,86%)">
  <div class="p-4"><nav id="navm" class="flex flex-col gap-1"></nav></div>
</aside>

<!-- боковая панель деталей -->
<div id="scrim" class="scrim" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer"><div id="drawerBody" class="p-6"></div></aside>

<script>
/* ============================================================
   ДАННЫЕ (детерминированные — один и тот же прототип при перезагрузке)
   ============================================================ */
let _s = 20260821;
function rnd(){ _s = (_s*1664525 + 1013904223) % 4294967296; return _s/4294967296; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function ri(a,b){ return Math.floor(rnd()*(b-a+1))+a; }
function chance(p){ return rnd() < p; }
function sample(a,n){ const c=[...a],o=[]; while(o.length<n && c.length) o.push(c.splice(Math.floor(rnd()*c.length),1)[0]); return o; }

const F_M = ['Алихан','Ерасыл','Нурислам','Дамир','Арсен','Санжар','Темирлан','Диас','Айдар','Мирас','Бекзат','Ильяс','Рустем','Данияр','Артём','Максим','Кирилл','Тимур','Даниил','Марк','Алдияр','Нурсултан','Жанибек','Асылан'];
const F_F = ['Аружан','Аяулым','Дана','Камила','Айгерим','Мадина','Инжу','Диана','Аружан','Сабина','Алина','Софья','Виктория','Полина','Анастасия','Амина','Жансая','Ботагоз','Карина','Асель','Лаура','Малика','Томирис','Айым'];
const LAST = ['Абдрахманов','Сериков','Тулегенов','Бекмуратов','Жумабаев','Оспанов','Ахметова','Нурланова','Касымова','Смирнов','Кузнецова','Волков','Соколова','Мухамеджанов','Дюсенбаев','Айтжанова','Калиев','Рахимова','Садыков','Ибрагимова','Петров','Морозова','Байжанов','Ержанова','Ким','Ли','Юсупов','Тлеубаева'];

const UNIS = [
  {n:'University of Toronto',c:'Канада',t:'RD',d:'2027-01-15'},
  {n:'University of British Columbia',c:'Канада',t:'RD',d:'2027-01-15'},
  {n:'McGill University',c:'Канада',t:'RD',d:'2027-01-21'},
  {n:'New York University',c:'США',t:'ED',d:'2026-11-01'},
  {n:'Boston University',c:'США',t:'EA',d:'2026-11-01'},
  {n:'Purdue University',c:'США',t:'EA',d:'2026-11-01'},
  {n:'Arizona State University',c:'США',t:'RD',d:'2027-02-01'},
  {n:'University of Michigan',c:'США',t:'EA',d:'2026-11-01'},
  {n:'Northeastern University',c:'США',t:'ED',d:'2026-11-01'},
  {n:'Penn State University',c:'США',t:'RD',d:'2026-11-30'},
  {n:'University College London',c:'Великобритания',t:'RD',d:'2027-01-14'},
  {n:'University of Manchester',c:'Великобритания',t:'RD',d:'2027-01-14'},
  {n:'University of Edinburgh',c:'Великобритания',t:'RD',d:'2027-01-14'},
  {n:'King\u2019s College London',c:'Великобритания',t:'RD',d:'2027-01-14'},
  {n:'TU Delft',c:'Нидерланды',t:'RD',d:'2027-01-15'},
  {n:'University of Amsterdam',c:'Нидерланды',t:'RD',d:'2027-01-15'},
  {n:'Technical University of Munich',c:'Германия',t:'RD',d:'2027-01-15'},
  {n:'Nanyang Technological University',c:'Сингапур',t:'RD',d:'2027-03-19'},
  {n:'National University of Singapore',c:'Сингапур',t:'RD',d:'2027-03-19'},
  {n:'University of Melbourne',c:'Австралия',t:'RD',d:'2026-12-15'},
  {n:'Korea University',c:'Южная Корея',t:'RD',d:'2026-11-15'},
  {n:'Sabanc\u0131 University',c:'Турция',t:'RD',d:'2027-02-28'},
  {n:'Taylor\u2019s University',c:'Малайзия',t:'RD',d:'2027-02-15'},
  {n:'Curtin University',c:'Австралия',t:'RD',d:'2026-12-01'}
];
const MAJORS = ['Computer Science','Business Administration','Mechanical Engineering','Economics','Data Science','Biomedical Sciences','Architecture','International Relations','Finance','Psychology','Civil Engineering','Graphic Design'];
const TRACKS = ['Olympiad','Research','Startup','Leadership','Volunteering','Competition'];
const SPORTS = ['Футбол','Баскетбол','Плавание','Дзюдо','Волейбол','Теннис','Лёгкая атлетика','Шахматы','Бокс','Художественная гимнастика'];
const TEACHERS = ['Г. Оспанова','М. Ким','А. Дюсенова','Р. Ахметов','С. Ниязова','Е. Волкова'];
const OLYMP = ['Респ. олимпиада по математике','Городская олимпиада по физике','Междунар. олимпиада по информатике','Олимпиада по химии, обл. этап'];
const PROJS = ['Школьный медиацентр','Мобильное приложение для расписания','Экопроект по раздельному сбору','Робототехнический прототип'];
const RESEA = ['Исследование качества воды Иле','Работа по машинному обучению','Социологический опрос по профориентации'];
const VOLUN = ['Приют для животных','Помощь пожилым','Уборка парка','Репетиторство для младших классов'];
const AWARDS = ['Алтын белгі (претендент)','Грамота акима района','1 место на хакатоне','Стипендия школы'];

function noteScore(x){ return x; }

/* ---------- ученики ---------- */
const STUDENTS = [];
for(let i=0;i<250;i++){
  const male = chance(.5);
  const first = male ? pick(F_M) : pick(F_F);
  let last = pick(LAST);
  if(!male && !/(ова|ева|ина|ая|ко|Ким|Ли)$/.test(last)) last = last.replace(/(ов|ев|ин|аев|иев|баев)$/, m=>m+'а');
  if(male) last = last.replace(/а$/,'');
  const name = last+' '+first;

  // IELTS: 30% <6.0, 50% 6.0-7.4, 20% 7.5+
  const r1 = rnd();
  let ielts = r1<.30 ? [4.5,5.0,5.5][ri(0,2)] : r1<.80 ? [6.0,6.5,7.0][ri(0,2)] : [7.5,8.0,8.5][ri(0,2)];
  const itarget = Math.min(9, ielts + (chance(.6)?1:1.5));
  const sec = k => Math.max(4, Math.min(9, ielts + [-1,-.5,0,.5][ri(0,3)]));

  // SAT: 35% <1200, 45% 1200-1499, 20% 1500+
  const r2 = rnd();
  let sat = r2<.35 ? ri(20,23)*50 : r2<.80 ? ri(24,29)*50 : ri(30,31)*50;
  const starget = Math.min(1600, sat + (chance(.5)?100:180));
  const mocks = []; let m = sat - ri(40,140);
  for(let k=0;k<ri(3,5);k++){ m += ri(-50,80); mocks.push(Math.max(800,Math.min(1590, Math.round(m/10)*10))); }
  mocks[mocks.length-1] = sat;

  const nUni = ri(3,6);
  const unis = sample(UNIS,nUni).map((u,idx)=>({
    ...u,
    tier: idx===0?'reach' : idx<3?'target':'safety',
    app: pick(['не начата','не начата','не начата','в работе','в работе','готова','подана'])
  }));

  const att = ri(72,100);
  const disc = att<82 ? ri(1,4) : chance(.15)?1:0;
  const hw = Math.max(30, Math.min(100, att - ri(-8,18)));
  const behav = (att<82 || disc>2 || hw<55) ? 'critical' : (att<92 || hw<75) ? 'needs_supervision' : 'can_execute';

  const hasCommon = chance(.55);
  const ready = unis.filter(u=>u.app==='подана'||u.app==='готова').length;
  const admScore = (hasCommon?2:0) + Math.min(ready,2) + (ielts>=6.5?1:0) + (sat>=1200?1:0);
  const adm = admScore>=5 ? 'A' : admScore>=3 ? 'B' : 'C';

  const tal = {
    olympiads: chance(.45)?sample(OLYMP,ri(1,2)):[],
    projects:  chance(.5)?sample(PROJS,ri(1,2)):[],
    research:  chance(.22)?sample(RESEA,1):[],
    startup:   chance(.12)?['Школьный стартап-проект']:[],
    leadership:chance(.35)?['Староста класса']:[],
    volunteering: chance(.55)?sample(VOLUN,ri(1,2)):[],
    competitions: chance(.4)?['Хакатон Astana Hub']:[],
    awards:    chance(.3)?sample(AWARDS,1):[]
  };
  const talCount = Object.values(tal).reduce((s,a)=>s+a.length,0);
  const portfolio = talCount>=6?'strong':talCount>=3?'medium':'weak';
  const track = chance(.78) ? pick(TRACKS) : null;

  const hasSport = chance(.6);
  const sport = hasSport ? {
    kind: pick(SPORTS),
    level: pick(['школьный','городской','областной','республиканский']),
    rank: pick(['без разряда','3 разряд','2 разряд','1 разряд','КМС']),
    comps: sample([
      {n:'Городская спартакиада',d:'2026-10-12',r:'2 место'},
      {n:'Областной чемпионат',d:'2026-11-08',r:'участие'},
      {n:'Республиканский турнир',d:'2027-02-20',r:'1 место'},
      {n:'Кубок города',d:'2026-09-28',r:'3 место'}
    ], ri(1,3)),
    certs: chance(.5), lead: chance(.3)?'Капитан команды':null
  } : null;

  STUDENTS.push({
    id:'S'+String(i+1).padStart(3,'0'), name, grade: chance(.5)?10:11,
    group:'G'+String(Math.floor(i/18)+1).padStart(2,'0'),
    email: 'student'+(i+1)+'@almapath.kz',
    hue: ri(0,359),
    att, disc, hw, behav,
    country: unis[0].c, major: pick(MAJORS), unis, hasCommon,
    appAccount: hasCommon || chance(.4), prepared: ready, adm,
    ielts, itarget, ieltsDate: '2026-'+pick(['05-16','06-20','07-11','08-02']),
    ieltsMock: Math.max(4, ielts + [-1,-.5,0,.5][ri(0,3)]),
    w:sec(), sp:sec(), rd:sec(), ls:sec(),
    sat, starget, satDate:'2026-'+pick(['06-07','08-23','05-03']), mocks,
    hoursWeek: ri(2,10), teacher: pick(TEACHERS),
    nextMock: '2026-09-'+String(ri(5,28)).padStart(2,'0'),
    tal, talCount, portfolio, track,
    gap: { have: [], need: [], todo: [] },
    sport
  });
}
// Portfolio Gap — считаем по факту
STUDENTS.forEach(s=>{
  const map = {olympiads:'Олимпиады',projects:'Проекты',research:'Research',startup:'Startup',leadership:'Leadership',volunteering:'Volunteering',competitions:'Competitions',awards:'Awards'};
  Object.entries(map).forEach(([k,label])=>{
    (s.tal[k].length ? s.gap.have : s.gap.need).push(label);
  });
  s.gap.todo = s.gap.need.slice(0,3).map(x=>({
    'Research':'Выбрать тему и научного руководителя',
    'Startup':'Собрать команду и описать идею',
    'Leadership':'Взять роль в школьном совете',
    'Volunteering':'Записаться в волонтёрский проект',
    'Competitions':'Подать заявку на осенний хакатон',
    'Awards':'Подготовиться к отборочному туру',
    'Олимпиады':'Записаться на школьный этап олимпиады',
    'Проекты':'Оформить один проект в портфолио'
  }[x] || ('Добавить: '+x)));
});

/* ---------- выпускники ---------- */
const ALUMNI = [];
for(let i=0;i<60;i++){
  const male = chance(.5);

function ring(pct, size=104, color='var(--brand)', inner=''){
  const r = size/2 - 8, c = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="block">
    <circle class="ringtrack" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="9"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-clamp(pct,0,100)/100)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    ${inner?`<foreignObject x="0" y="0" width="${size}" height="${size}">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:${size}px;height:${size}px;display:grid;place-items:center;text-align:center">${inner}</div>
    </foreignObject>`:''}
  </svg>`;
}
function spark(vals, w=170, h=46, color='var(--teal)'){
  const mn=Math.min(...vals)-30, mx=Math.max(...vals)+30;
  const pts = vals.map((v,i)=>[i*(w/(vals.length-1||1)), h-((v-mn)/(mx-mn))*h]);
  const d = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${color}"/>`).join('')}
  </svg>`;
}
function bar(pct, color='var(--brand)'){ return `<div class="bar"><i style="width:${clamp(pct,0,100)}%;background:${color}"></i></div>`; }

function daysLeft(d){ return Math.round((new Date(d) - new Date('2026-08-21'))/86400000); }

/* Readiness Score — единый процент готовности */
function readiness(s){
  // прогресс от стартовой планки к личной цели, а не голое отношение к цели
  const ie = clamp((s.ielts-4.0)/(s.itarget-4.0),0,1);
  const sa = clamp((s.sat-800)/(s.starget-800),0,1);
  const exams = ((ie+sa)/2)*100;
  const adm   = clamp(s.unis.length/3,0,1)*25 + (s.hasCommon?25:0) + (s.appAccount?10:0) + clamp(s.prepared/3,0,1)*40;
  const tal   = clamp(s.talCount/8,0,1)*100;
  const disc  = (s.att + s.hw)/2;
  const sport = s.sport ? clamp((s.sport.comps.length/3)*60 + (s.sport.certs?25:0) + (s.sport.lead?15:0),0,100) : null;
  let W = {exams:35, adm:25, tal:20, disc:10, sport:10};
  if(sport===null){ const add = W.sport/4; W = {exams:W.exams+add, adm:W.adm+add, tal:W.tal+add, disc:W.disc+add, sport:0}; }
  const parts = [
    {k:'Экзамены', v:exams, w:W.exams},
    {k:'Поступление', v:adm, w:W.adm},
    {k:'Портфолио', v:tal, w:W.tal},
    {k:'Учебная дисциплина', v:disc, w:W.disc}
  ];
  if(sport!==null) parts.push({k:'Спорт', v:sport, w:W.sport});
  const total = parts.reduce((a,p)=>a + p.v*p.w/100, 0);
  // где больше всего восстановимых баллов — туда и стоит вкладываться
  const weakest = [...parts].sort((a,b)=> (100-b.v)*b.w - (100-a.v)*a.w)[0];
  return {score: Math.round(total), parts, weakest};
}

function donut(segs, size=132){
  const r = size/2-11, c = 2*Math.PI*r; let off = 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="ringtrack" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="15"/>
    ${segs.map(sg=>{ const len = c*sg.v; const el =
      `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${sg.color}" stroke-width="15"
        stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"
        transform="rotate(-90 ${size/2} ${size/2})"/>`; off += len; return el; }).join('')}
  </svg>`;
}
function kpi(value, label, note, color='var(--ink)'){
  return `<div class="card card-pad">

function cellVal(s,k){

    uniCount: s.unis.length, hasCommon: s.hasCommon?'да':'нет', appAccount: s.appAccount?'да':'нет',

    sportKind: s.sport?s.sport.kind:'—', sportLevel: s.sport?s.sport.level:'—',
    sportRank: s.sport?s.sport.rank:'—', sportComps: s.sport?s.sport.comps.length:'—',
    sportCerts: s.sport?(s.sport.certs?'да':'нет'):'—',
    behav: BEHAV[s.behav][0], adm: s.adm, portfolio: PORT[s.portfolio][0],
    nextMock: fmtDate(s.nextMock)
  };
  if(k in m) return m[k];

risks(){

all(){

/* --- Асем --- */
deadlines(){
  const rows = [];
  STUDENTS.forEach(s=>s.unis.forEach(u=>rows.push({s,u,dl:daysLeft(u.d)})));
  const soon = rows.filter(r=>r.dl>0&&r.dl<=120).sort((a,b)=>a.dl-b.dl);
  const byUni = {};
  soon.forEach(r=>{ (byUni[r.u.n] = byUni[r.u.n]||{u:r.u,dl:r.dl,n:0}).n++; });
  return `
  ${h2('⏱ Дедлайны','Ближайшие 120 дней','Сгруппировано по вузам: сколько учеников подаётся и сколько дней осталось.')}

      <div class="card card-pad">

          <div class="flex-1"><div class="font-bold text-[14.5px] leading-snug">${esc(x.u.n)}</div>

},

  const noCert = ath.filter(s=>!s.sport.certs);
  return `
  ${h2('⚽️ Спорт','Нурлыбек — директор спорта','Спортсмены, чей профиль реально усиливает application.')}
  <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
    ${kpi(ath.length,'Занимаются спортом','из 250 учеников')}
    ${kpi(strong.length,'Сильный профиль','областной уровень и выше','var(--ok)')}
    ${kpi(noCert.length,'Без сертификатов','достижения не подтверждены','var(--risk)')}
    ${kpi(ath.filter(s=>s.sport.lead).length,'Лидерские роли','капитаны команд','var(--brand)')}
  </div>
  <div class="grid lg:grid-cols-2 gap-4">
    ${listPanel('Перспективные спортсмены', strong, s=>`<div class="text-right">
      <div class="text-[12.5px] font-bold">${esc(s.sport.kind)}</div>
      <div class="text-[11px]" style="color:var(--ink-40)">${esc(s.sport.rank)}</div></div>`, 14)}
    ${listPanel('Собрать сертификаты', noCert, s=>`<span class="chip chip-warn">${esc(s.sport.level)}</span>`, 14)}
  </div>`;
}

/* ============================================================
   КАРТОЧКА УЧЕНИКА
   ============================================================ */
function studentCard(id){
  const s = STUDENTS.find(x=>x.id===id), my = ROLES[state.role].domain;
  const OWNER = {behav:'Салтанат', adm:'Асем', exam:'Кымбат', tal:'Арман', sport:'Нурлыбек'};
  const R = readiness(s);

  const block = (dom, eyebrow, title, rows) => {
    const mine = dom===my;
    return `<div class="card card-pad ${mine?'':'opacity-[.72]'}" ${mine?'style="border-color:var(--brand)"':''}>
      <div class="flex items-center gap-2 mb-4">
        <div class="eyebrow">${eyebrow} ${title}</div>
        <span class="chip ${mine?'chip-brand':'chip-mute'} ml-auto">${mine?'вы редактируете':'ведёт: '+OWNER[dom]}</span>
      </div>
      <div class="grid sm:grid-cols-2 gap-x-5 gap-y-1">
        ${rows.map(([k,v])=>`<div class="flex items-center gap-3 py-2 border-b hairline">
          <span class="text-[12.5px] flex-none w-[112px]" style="color:var(--ink-60)">${k}</span>
          ${mine ? `<input class="cell num flex-1 font-semibold" value="${esc(v)}">`
                 : `<span class="num flex-1 font-semibold text-[13.5px]" style="color:var(--ink-40)">${esc(v)}</span>`}
        </div>`).join('')}
      </div>
    </div>`;
  };

  document.getElementById('screen').innerHTML = `<div class="fade">
    <button onclick="render()" class="btn btn-ghost btn-sm mb-5">← Назад</button>
    <div class="card card-pad mb-4">
      <div class="flex flex-wrap items-center gap-4">
        ${avatar(s,60)}
        <div class="flex-1 min-w-0">
          <h2 class="text-[24px] font-extrabold">${esc(s.name)}</h2>
          <div class="text-[13.5px] mt-1" style="color:var(--ink-60)">${s.grade} класс · группа ${s.group} · ${esc(s.email)}</div>
        </div>
        <div class="flex items-center gap-4">
          ${ring(R.score, 84, 'var(--brand)', `<div><div class="num" style="font-size:19px;font-weight:800;line-height:1">${R.score}%</div>
            <div style="font-size:9.5px;color:var(--ink-40)">готовность</div></div>`)}
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-4 pt-4 border-t hairline">
        <span class="chip ${BEHAV[s.behav][1]}">${BEHAV[s.behav][0]}</span>
        <span class="chip ${ADM[s.adm][1]}">${ADM[s.adm][0]}</span>
        <span class="chip ${PORT[s.portfolio][1]}">Portfolio: ${PORT[s.portfolio][0]}</span>
        <span class="chip chip-mute">IELTS ${s.ielts.toFixed(1)}</span>
        <span class="chip chip-mute">SAT ${s.sat}</span>
      </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-4">
      ${block('behav','⚙️','Профиль и дисциплина',[['Посещаемость',s.att+'%'],['Замечания',s.disc],['Задания',s.hw+'%'],['Статус',BEHAV[s.behav][0]]])}
      ${block('adm','🎓','Поступление',[['Страна',s.country],['Специальность',s.major],['Вузов',s.unis.length],['Common App',s.hasCommon?'да':'нет'],['Заявок готово',s.prepared],['Статус',s.adm]])}
      ${block('exam','🎯','Экзамены',[['IELTS',s.ielts.toFixed(1)],['IELTS цель',s.itarget.toFixed(1)],['Mock',s.ieltsMock.toFixed(1)],['W / S / R / L',[s.w,s.sp,s.rd,s.ls].map(x=>x.toFixed(1)).join(' / ')],['SAT',s.sat],['SAT цель',s.starget],['Часов в неделю',s.hoursWeek],['Преподаватель',s.teacher]])}
      ${block('tal','🏆','Таланты',[['Активностей',s.talCount],['Трек',s.track||'не выбран'],['Статус',PORT[s.portfolio][0]],['Пробелов',s.gap.need.length]])}
      ${s.sport
        ? block('sport','⚽️','Спорт',[['Вид',s.sport.kind],['Уровень',s.sport.level],['Разряд',s.sport.rank],['Соревнований',s.sport.comps.length],['Сертификаты',s.sport.certs?'да':'нет'],['Лидерство',s.sport.lead||'нет']])
        : `<div class="card card-pad opacity-[.72]"><div class="flex items-center gap-2 mb-4">
            <div class="eyebrow">⚽️ Спорт</div><span class="chip chip-mute ml-auto">ведёт: Нурлыбек</span></div>
            <p class="text-[13px]" style="color:var(--ink-40)">Спортом не занимается. Вес этого домена перераспределён на остальные.</p></div>`}
    </div>
  </div>`;
  window.scrollTo(0,0);
}

</script>
