[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
# RUF001-003 — кириллица в строках и docstring, для нас это норма
# RUF012 — ложное срабатывание на class Meta у моделей Django
# DJ001 — blank=True на текстовых полях используем осознанно
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "DJ001"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "alumni",
    "config",
    "core",
    "directories",
    "engagement",
    "materials",
    "prep",
    "roadmap",
    "students",
    "suggestions",
    "universities",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
# --ds важнее переменной окружения: в контейнере DJANGO_SETTINGS_MODULE=dev,
# и без явного указания тесты шли бы на настройках разработки
addopts = "-q --reuse-db --ds=config.settings.test"
# перечисляем все приложения: без `roadmap`, `alumni` и `engagement`
# их тесты молча не запускались
testpaths = [
    "accounts",
    "alumni",
    "core",
    "directories",
    "engagement",
    "materials",
    "prep",
    "roadmap",
    "students",
    "suggestions",
    "universities",
]
